/**:
    ros__parameters:
      registration_method: "NDT_OMP"
      score_threshold: 0.2
      ndt_resolution: 1.0
      ndt_step_size: 0.1
      # ndt_max_iterations: 35
      ndt_num_threads: 0
      transform_epsilon: 0.01
      voxel_leaf_size: 0.1
      scan_max_range: 100.0
      scan_min_range: 0.1
      scan_period: 0.05
      use_pcd_map: true
      map_path: ""
      set_initial_pose: true

      # BIM elevetor hole
      # initial_pose_x: 48.0
      # initial_pose_y: 27.0
      # initial_pose_z: 13.0

      initial_pose_x: 80.0
      initial_pose_y: 7.0
      initial_pose_z: 13.0
      initial_pose_qx: 0.0
      initial_pose_qy: 0.0
      initial_pose_qz: 3.14
      initial_pose_qw: 1.0
      use_imu: false
      enable_debug: false
      enable_debug_topic: true
      global_frame_id: map
      odom_frame_id: odom
      base_frame_id: base_link
      # enable_debug: true

      # 出力と /ndt_pose の stamp、TF の初期値を引く時刻（点群のトピック自体の stamp は変えない）
      #   "receipt" : この PC で受信した時刻（now()）
      #   "message" : 点群ヘッダの stamp（時刻同期済み・Gazebo）
      #   "auto"    : |受信した時刻 − stamp| が scan_time_auto_threshold（既定 0.1 s）以上なら受信した時刻、小さければ stamp
      # localization_bringup から起動するときは、環境ファイルの stamp_mode（stamp -> "message"）で launch が決める
      scan_time_source: "message"

      # /pcl_pose (→/current_pose) の基準。TF（map -> base_link）と /path は常に base_link
      #   "base_link" : 車両中心
      #   "lidar"     : LiDAR 中心（NDT の解そのもの）
      # base_link への変換に使う取付 base_link -> LiDAR は静的 TF から読む
      pose_output_frame: "lidar"


      # ---- EKF（ekf_localizer）との連携 ----
      # 単体で使うときは既定のまま。localization_bringup で EKF と起動するときは launch が上書きする
      publish_tf: true                  # map -> base_link の TF を配信するか（EKF が配信するときは false）
      use_tf_init_guess: false          # NDT の初期値を TF（EKF の推定値）から点群の取得時刻で引くか
      tf_init_guess_timeout: 0.05       # 上の TF を待つ時間 [s]
      use_fitness_reject: false         # fitness_score が閾値を超えた解を /ndt_pose に出さないか
      fitness_reject_threshold: 1.0     # 上の閾値

      ## -- Rviz ---
      map_viz_leaf_size: 0.1
