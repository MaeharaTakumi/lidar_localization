/**:
    ros__parameters:
      registration_method: "NDT_OMP"
      score_threshold: 0.2
      ndt_resolution: 1.0
      ndt_step_size: 0.1
      # ndt_max_iterations: 35
      ndt_num_threads: 0
      transform_epsilon: 0.01
      voxel_leaf_size: 0.1
      scan_max_range: 100.0
      scan_min_range: 0.1
      scan_period: 0.05
      use_pcd_map: true
      map_path: ""
      set_initial_pose: true

      # BIM elevetor hole
      # initial_pose_x: 48.0
      # initial_pose_y: 27.0
      # initial_pose_z: 13.0

      initial_pose_x: 0.0
      initial_pose_y: 0.0
      initial_pose_z: 0.0
      initial_pose_qx: 0.0
      initial_pose_qy: 0.0
      initial_pose_qz: 0.0
      initial_pose_qw: 1.0
      use_odom: true
      use_imu: false
      enable_debug: false
      enable_debug_topic: true
      global_frame_id: map
      odom_frame_id: odom
      base_frame_id: base_link
      # enable_debug: true

      # ---- 速度入力（段階3）----
      # 速度入力の購読先（どちらも nav_msgs/Odometry）
      #   "Gazebo" : odom
      #   "Real"   : odom_topic（whill_odometry の出力）
      ros2_mode: "Real"
      odom_topic: "/wheelchair/odom"

      # 点群の時刻。点群は別 PC（時刻同期なし）が stamp を付けているため既定は受信時刻
      #   "receipt" : この PC で受信した時刻（now()）。出力の stamp と EKF の観測時刻に使う
      #   "message" : 点群ヘッダの stamp（時刻同期済みの環境や stamp を直した bag 用）
      scan_time_source: "receipt"

      # /pcl_pose (→/current_pose) の基準。TF（map -> base_link）と /path は常に base_link
      #   "base_link" : 車両中心
      #   "lidar"     : LiDAR 中心（base_link に取付 lidar_offset / lidar_rotation を合成した姿勢）
      pose_output_frame: "lidar"

      # RViz 専用 TF。map -> base_link を点群ヘッダの時刻で /tf_rviz に配信する
      # （launch で RViz の /tf を /tf_rviz に remap。/tf と /current_pose はこの PC の時刻のまま）
      publish_rviz_tf: true

      # EKF のパラメータは src/ekf/config/ekf.yaml（launch で併せて渡す）
