# EKF のパラメータ（docs/ekf_design.md 5.3 節）。編集後は再ビルドが必要
# 状態の並び：[x, y, z, roll, pitch, yaw, v, omega]（base_link）
/**:
    ros__parameters:
      use_ekf: true                     # EKF を使うか
      ekf_model: "ndt_odom"                # "ndt_only"：NDT のみ / "ndt_odom"：NDT ＋ オドメトリ観測
      use_ekf_init_guess: true             # NDT の初期値を EKF の推定値から作るか
      use_ekf_for_pose_output: true        # /current_pose・TF・/path を EKF の推定値にするか
      time_source: "wall"                  # EKF の時刻："wall"（受信時の now()）/ "stamp"（メッセージ時刻）
      max_predict_dt: 0.2                  # 1 回の予測で進める dt の上限 [s]

      lidar_frame_id: "velodyne"           # 静的 TF base_link -> LiDAR の子フレーム名
      lidar_offset:   [-0.17, 0.0, 1.2]    # base_link -> LiDAR の並進 [x, y, z] [m]
      lidar_rotation: [0.0, 0.0, -0.017]   # base_link -> LiDAR の回転 [roll, pitch, yaw] [rad]

      # プロセスノイズ（スペクトル密度）[x, y, z, roll, pitch, yaw, v, omega]
      # [m^2/s], [rad^2/s], [m^2/s^3], [rad^2/s^3]
      Q:      [5.0e-2, 5.0e-2, 5.0e-3, 5.0e-2, 5.0e-2, 5.0e-2, 0.05, 0.1]
      # NDT 観測ノイズ（分散、LiDAR 座標）[x, y, z, roll, pitch, yaw] [m^2], [rad^2]
      R_ndt:  [1.0e-2, 1.0e-2, 1.0e-2, 0.03, 0.03, 1.0e-3]
      # オドメトリ観測ノイズ（分散）[v, omega] [m^2/s^2], [rad^2/s^2]
      R_odom: [2.5e-3, 5.0e-3]
      # 初期共分散（分散、base_link）[x, y, z, roll, pitch, yaw, v, omega]
      P_init: [2.0e-2, 2.0e-2, 2.0e-2, 0.06, 0.06, 2.0e-3, 1.0, 1.0]

      gate_horizontal: 11.34               # NDT の [x, y, yaw] のゲート（chi2(3, 0.99)）
      gate_1d: 6.63                        # NDT の z, roll, pitch それぞれのゲート（chi2(1, 0.99)）
      lockout_count: 10                    # z, roll, pitch がこの回数連続で棄却されたら観測値で再初期化（0 以下で無効）
      use_fitness_reject: false            # fitness_score が閾値を超えた NDT 解で EKF を更新しないか
      fitness_reject_threshold: 1.0        # 上の閾値

      odom_covariance_source: "param"      # R_odom の出どころ："param"（上の R_odom）/ "message"（twist.covariance）
      gate_odom: 9.21                      # オドメトリのゲート（chi2(2, 0.99)）
      odom_timeout_init: 0.2               # 初期化時、この秒数以内のオドメトリがあれば v, omega をその値にする [s]
